spring:
  application:
    name: project-patory

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/petory?serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true
    username: ${SPRING_DATASOURCE_USERNAME:petoryuser}
    password: ${SPRING_DATASOURCE_PASSWORD:petoryuser123!}
    driver-class-name: com.mysql.cj.jdbc.Driver

jwt:
  secret: ${JWT_SECRET:default_jwt_secret_key_for_local_development_environment}

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY:dummy_access_key}
      secret-key: ${AWS_SECRET_KEY:dummy_secret_key}
    s3:
      bucket: ${AWS_S3_BUCKET_NAME:dummy_bucket}
    region:
      static: ap-northeast-2


mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: net.likelion.bebc25.projectpatory.dto