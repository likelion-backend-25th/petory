spring:
  application:
    name: project-patory

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/petory-db?serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: always

  config:
    import: optional:file:.env[.properties], optional:application-oauth.yaml

  # application-oauth.yaml 은 git 에 올라가지 않으므로 CI/운영에서는 이 설정과 환경변수로 동작한다
  # 빈 문자열이면 기동 실패(Client id must not be empty)하므로 기본값은 dummy
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
            scope:
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          kakao:
            client-id: ${KAKAO_CLIENT_ID:dummy-kakao-client-id}
            client-secret: ${KAKAO_CLIENT_SECRET:dummy-kakao-client-secret}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            scope:
              - profile_nickname
              - profile_image
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id


# MyBatis 설정
mybatis:
  # 매퍼 XML 파일 경로 매핑
  mapper-locations: classpath:mapper/**/*.xml
  # DTO 패키지 별칭 지정 (매퍼 XML에서 패키지명 생략 가능)
  type-aliases-package: net.likelion.bebc25.projectpatory.dto
  configuration:
    # DB 컬럼명 스네이크 케이스를 자바 카멜 케이스 필드로 자동 변환
    map-underscore-to-camel-case: true
    # 쿼리 실행 로그 콘솔 출력 (개발/테스트 디버깅용)
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl


# Springdoc OpenAPI 및 Swagger UI 설정
springdoc:
  # 기본 응답 미디어 타입을 application/json으로 지정
  default-produces-media-type: application/json
  swagger-ui:
    # Swagger UI 엔드포인트 커스텀 경로 설정
    path: /swagger-ui.html
    # 태그 그룹 정렬 기준 (옵션: alpha - 태그명 알파벳/가나다 사전순)
    tags-sorter: alpha
    # 개별 API 엔드포인트 정렬 기준 (옵션: alpha - URI 경로 사전순, method - HTTP 메서드명 알파벳순)
    operations-sorter: alpha
  api-docs:
    # OpenAPI 문서 자동 생성 활성화 및 엔드포인트 경로
    enabled: true
    path: /v3/api-docs

logging:
  level:
    org.springframework.security: DEBUG

jwt:
  # 변경: 기본값에 '_'가 있어 Base64 디코딩 실패 -> 유효한 Base64 문자열로 교체
  secret: ${JWT_SECRET:ZGVmYXVsdC1qd3Qtc2VjcmV0LWtleS1mb3ItbG9jYWwtdGVzdC1lbnZpcm9ubWVudA==}
  access-token-expiration: 3600000      # 1시간 (밀리초 단위)
  refresh-token-expiration: 604800000   # 7일 (밀리초 단위)

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY:dummy_access_key}
      secret-key: ${AWS_SECRET_KEY:dummy_secret_key}
    s3:
      bucket: ${AWS_S3_BUCKET_NAME:dummy_bucket}
    region:
      static: ap-northeast-2

portone:
  api:
    store-id: ${PORTONE_STORE_ID:dummy-store-id}
    secret: ${PORTONE_API_SECRET:dummy-api-secret}