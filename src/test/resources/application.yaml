spring:
  application:
    name: project-patory

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/petory?serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: ${SPRING_DATASOURCE_USERNAME:petoryuser}
    password: ${SPRING_DATASOURCE_PASSWORD:petoryuser123!}

  # 데이터베이스 초기화 설정 (schema.sql 및 data.sql 자동 실행)
  sql:
    init:
      mode: always # 배포/테스트 시 자동 실행되도록 always로 설정 (필요시 never로 변경)
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

# MyBatis 설정
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: net.likelion.bebc25.projectpatory.dto
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT 설정
jwt:
  secret: ${JWT_SECRET:default_jwt_secret_key_for_local_development_environment}

# AWS S3 설정
cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY:test-access-key}
      secret-key: ${AWS_SECRET_KEY:test-secret-key}
    s3:
      bucket: ${AWS_S3_BUCKET_NAME:test-bucket}
    region:
      static: ap-northeast-2