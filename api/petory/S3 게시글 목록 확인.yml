info:
  name: S3 게시글 목록 확인
  type: http
  seq: 23
  docs: |-
    S3 E2E 5단계. 목록 응답에서 방금 작성한 게시글의 imageUrls 에 fileUrl 이 있는지 확인한다.

http:
  method: GET
  url: "{{baseUrl}}/posts?size=10"
  params:
    - name: size
      value: "10"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
