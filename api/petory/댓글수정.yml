info:
  name: 댓글수정
  type: http
  seq: 13

http:
  method: PUT
  url: "{{baseUrl}}/posts/1/comments/{{commentId}}"
  body:
    type: json
    data: |-
      {
        "content": "내용을 조금 고쳤습니다."
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
