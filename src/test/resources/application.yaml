spring:
  application:
    name: project-patory

  # 변경: 프로젝트 루트의 .env를 읽어 JWT_SECRET, DB 계정 등 환경변수 값을 채움 (없으면 무시)
  config:
    import: optional:file:.env[.properties], optional:application-oauth.yaml

  # CI 에는 application-oauth.yaml 이 없어서 이 설정이 없으면 ClientRegistrationRepository 빈 생성 실패
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
            scope:
              - profile
              - email
          kakao:
            client-id: ${KAKAO_CLIENT_ID:dummy-kakao-client-id}
            client-secret: ${KAKAO_CLIENT_SECRET:dummy-kakao-client-secret}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${MYSQL_DATABASE:petory_db}?serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  # 데이터베이스 초기화 설정 (schema.sql 및 data.sql 자동 실행)
  sql:
    init:
      mode: always # 배포/테스트 시 자동 실행되도록 always로 설정 (필요시 never로 변경)
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

# MyBatis 설정
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: net.likelion.bebc25.projectpatory.dto
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT 설정
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000      # 1시간 (밀리초)
  refresh-token-expiration: 604800000   # 7일 (밀리초)

# AWS S3 설정
cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY:test-access-key}
      secret-key: ${AWS_SECRET_KEY:test-secret-key}
    s3:
      bucket: ${AWS_S3_BUCKET_NAME:test-bucket}
    region:
      static: ap-northeast-2

# 변경: PaymentServiceImpl의 @Value("${portone.api.secret}")를 위해 추가 (값은 .env에서 읽음)
portone:
  store-id: ${PORTONE_STORE_ID:dummy-store-id}
  channel-key: ${PORTONE_CHANNEL_KEY:dummy-channel-key}
  api:
    store-id: ${PORTONE_STORE_ID}
    secret: ${PORTONE_API_SECRET}